<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patchbay.js — Configurations</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div style="max-width: 32rem; width: 100%">
      <a class="back-link" href="index.html">&larr; Back to examples</a>
      <h1>Configurator</h1>
      <p style="color: #6b7280; margin-bottom: 1.5rem">Tweak params live and watch the cable change.</p>
    </div>

    <div class="form-card">
      <form id="config-form" class="form-grid">
        <div><label for="color">Color</label><input type="color" id="color" name="color" value="#FF0000" /></div>
        <div>
          <label for="gravity">Gravity</label><input type="number" id="gravity" name="gravity" value="1" step="0.1" />
        </div>
        <div>
          <label for="slack">Slack</label><input type="number" id="slack" name="slack" value="1.1" step="0.1" />
        </div>
        <div>
          <label for="lineThickness">Thickness</label
          ><input type="number" id="lineThickness" name="lineThickness" value="2" />
        </div>
        <div>
          <label for="segments">Segments</label><input type="number" id="segments" name="segments" value="20" />
        </div>
        <div>
          <label for="iterations">Iterations</label><input type="number" id="iterations" name="iterations" value="5" />
        </div>
        <div>
          <label for="dragHandleSize">Handle size</label
          ><input type="number" id="dragHandleSize" name="dragHandleSize" value="20" />
        </div>
        <div>
          <label for="snapRadius">Snap radius</label
          ><input type="number" id="snapRadius" name="snapRadius" value="100" />
        </div>

        <div class="form-actions">
          <button type="button" id="move-cable" class="btn">Random port</button>
          <div class="flex-spacer"></div>
          <button type="button" id="apply-config" class="btn">Apply</button>
        </div>
      </form>
    </div>

    <div style="max-width: 32rem; width: 100%">
      <h2>Preview</h2>
      <div class="panel">
        <div class="port-grid">
          <div id="input-1" class="connector cable-connector"><div class="connector-inner"></div></div>
          <div id="input-2" class="connector cable-connector"><div class="connector-inner"></div></div>
          <div id="input-3" class="connector cable-connector"><div class="connector-inner"></div></div>
          <div id="input-4" class="connector cable-connector"><div class="connector-inner"></div></div>
          <div id="input-5" class="connector cable-connector"><div class="connector-inner"></div></div>
          <div id="input-6" class="connector cable-connector"><div class="connector-inner"></div></div>
        </div>
        <hr class="panel-divider" />
        <div class="port-grid">
          <div id="output-1" class="connector blue cable-connector"><div class="connector-inner"></div></div>
          <div id="output-2" class="connector blue cable-connector"><div class="connector-inner"></div></div>
          <div id="output-3" class="connector blue cable-connector"><div class="connector-inner"></div></div>
          <div id="output-4" class="connector blue cable-connector"><div class="connector-inner"></div></div>
          <div id="output-5" class="connector blue cable-connector"><div class="connector-inner"></div></div>
          <div id="output-6" class="connector blue cable-connector"><div class="connector-inner"></div></div>
        </div>
      </div>
    </div>

    <script src="../dist/patchbay.umd.js"></script>
    <script>
      const patchbay = new Patchbay({ color: "#FF0000" });
      const start = document.getElementById("input-1");
      const end = document.getElementById("output-6");
      let cable = patchbay.connect(start, end);
      patchbay.start();

      document.getElementById("apply-config").addEventListener("click", () => {
        const fd = new FormData(document.getElementById("config-form"));
        patchbay.clear();
        Object.assign(patchbay.config, {
          color: fd.get("color"),
          gravity: parseFloat(fd.get("gravity")),
          slack: parseFloat(fd.get("slack")),
          lineThickness: parseFloat(fd.get("lineThickness")),
          segments: parseInt(fd.get("segments")),
          iterations: parseInt(fd.get("iterations")),
          dragHandleSize: parseInt(fd.get("dragHandleSize")),
          snapRadius: parseInt(fd.get("snapRadius")),
        });
        cable = patchbay.connect(start, end);
      });

      document.getElementById("move-cable").addEventListener("click", () => {
        const outputs = document.querySelectorAll("[id^='output-']");
        cable.end = outputs[Math.floor(Math.random() * outputs.length)];
      });
    </script>
  </body>
</html>
