<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patchbay.js — Click to add</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .connector.clickable {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="page-header">
      <a class="back-link" href="index.html">&larr; Back to examples</a>
      <h1>Click to add</h1>
      <p>Drag from a port to create a cable, then release near another port to connect.</p>
    </div>

    <div class="panel">
      <div class="port-grid">
        <div id="input-1" class="connector cable-connector clickable"><div class="connector-inner"></div></div>
        <div id="input-2" class="connector cable-connector clickable"><div class="connector-inner"></div></div>
        <div id="input-3" class="connector cable-connector clickable"><div class="connector-inner"></div></div>
        <div id="input-4" class="connector cable-connector clickable"><div class="connector-inner"></div></div>
        <div id="input-5" class="connector cable-connector clickable"><div class="connector-inner"></div></div>
        <div id="input-6" class="connector cable-connector clickable"><div class="connector-inner"></div></div>
      </div>
      <hr class="panel-divider" />
      <div class="port-grid">
        <div id="output-1" class="connector blue cable-connector clickable"><div class="connector-inner"></div></div>
        <div id="output-2" class="connector blue cable-connector clickable"><div class="connector-inner"></div></div>
        <div id="output-3" class="connector blue cable-connector clickable"><div class="connector-inner"></div></div>
        <div id="output-4" class="connector blue cable-connector clickable"><div class="connector-inner"></div></div>
        <div id="output-5" class="connector blue cable-connector clickable"><div class="connector-inner"></div></div>
        <div id="output-6" class="connector blue cable-connector clickable"><div class="connector-inner"></div></div>
      </div>
    </div>

    <script src="../dist/patchbay.umd.js"></script>
    <script>
      const patchbay = new Patchbay({ gravity: 2, slack: 1.2, snapRadius: 100 });

      document.querySelectorAll(".connector").forEach((el) => {
        el.addEventListener("mousedown", (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          patchbay.startCable(el, { color: "#6468F0" });
        });
      });

      patchbay.start();
    </script>
  </body>
</html>
