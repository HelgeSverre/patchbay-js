<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patchbay.js — Basic usage</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-header">
      <a class="back-link" href="index.html">&larr; Back to examples</a>
      <h1>Basic usage</h1>
      <p>Minimal configuration connecting two ports.</p>
    </div>

    <div class="panel">
      <div class="port-grid">
        <div id="input-1" class="connector"><div class="connector-inner"></div></div>
        <div id="input-2" class="connector"><div class="connector-inner"></div></div>
        <div id="input-3" class="connector"><div class="connector-inner"></div></div>
        <div id="input-4" class="connector"><div class="connector-inner"></div></div>
        <div id="input-5" class="connector"><div class="connector-inner"></div></div>
        <div id="input-6" class="connector"><div class="connector-inner"></div></div>
      </div>
      <hr class="panel-divider" />
      <div class="port-grid">
        <div id="output-1" class="connector blue"><div class="connector-inner"></div></div>
        <div id="output-2" class="connector blue"><div class="connector-inner"></div></div>
        <div id="output-3" class="connector blue"><div class="connector-inner"></div></div>
        <div id="output-4" class="connector blue"><div class="connector-inner"></div></div>
        <div id="output-5" class="connector blue"><div class="connector-inner"></div></div>
        <div id="output-6" class="connector blue"><div class="connector-inner"></div></div>
      </div>
    </div>

    <script src="../dist/patchbay.umd.js"></script>
    <script>
      const patchbay = new Patchbay({ draggable: false, color: "red" });
      patchbay.connect(document.getElementById("input-1"), document.getElementById("output-2"));
      patchbay.connect(document.getElementById("input-1"), document.getElementById("output-5"));
      patchbay.start();
    </script>
  </body>
</html>
